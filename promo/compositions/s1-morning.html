    const tl = gsap.timeline({ paused: true });
    const root = document.querySelector('[data-composition-id="s1"]');
    const q = (s) => root.querySelector(s);
    const lines = root.querySelectorAll('.s1-ln');

    // camera target: the conflict line, measured once with the camera at rest
    const conf = q('#s1-conf').getBoundingClientRect();
    const base = root.getBoundingClientRect();
    const cx = conf.left - base.left + conf.width / 2;
    const cy = conf.top - base.top + conf.height / 2;
    const at = (s) => ({ scale: s, x: 960 - cx * s, y: 540 - cy * s });

    tl.fromTo('#s1-roll', { yPercent: 0 }, { yPercent: -50, duration: 0.35, ease: 'power3.inOut' }, 0.45);

    tl.fromTo(lines, { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, stagger: 0.07, ease: 'power2.out' }, 1.15);
